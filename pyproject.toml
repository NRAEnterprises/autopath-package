[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autopath"
version = "1.0.0"
description = "Auto-correcting filesystem path creation, sanitization, and unique naming — core organizational logic shared across projects."
requires-python = ">=3.9"
dependencies = []

[project.scripts]
autopath = "autopath.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
